<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7fb" />
    <link rel="icon" type="image/png" href="/orange-logo.png" />
    <script>
      try {
        const theme = localStorage.getItem('ai-interview-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (theme === 'dark' || (!theme && prefersDark)) document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <title>PrepVela — AI Interview Practice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
